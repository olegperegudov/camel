[package]
name = "camel"
version = "0.1.9"
description = "Claude Code usage limits in the menu bar"
authors = ["Oleg Peregudov"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name from colliding with the bin name on
# Windows (rust-lang/cargo#8519).
name = "camel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-updater = "2"
# Only ever opens the app's own setup guide — the URL lives in Rust, so the
# webview cannot name a destination of its own.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
# NSEvent's global monitor takes an Objective-C block and nothing else — that is
# how we notice a click landing anywhere outside the panel.
block = "0.1"
# Turns the borderless window into a floating NSPanel: an ordinary window of an
# Accessory app never reached the screen on macOS 26 (see mac_window.rs).
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
