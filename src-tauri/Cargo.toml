[package]
name = "camel"
version = "0.1.5"
description = "Claude Code usage limits in the menu bar"
authors = ["Oleg Peregudov"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name from colliding with the bin name on
# Windows (rust-lang/cargo#8519).
name = "camel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tokio = { version = "1", features = ["time"] }
