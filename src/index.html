<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Camel</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="panel">
    <section id="rows" hidden>
      <div class="row" id="row-five">
        <div class="name">5h</div>
        <!-- The bar is the whole reading: its length is what's left, its colour
             how bad that is. The words a screen reader needs live in the label,
             since "5h" alone says nothing out loud. -->
        <div class="line">
          <span class="bar" role="progressbar" aria-label="last 5 hours" aria-valuemin="0" aria-valuemax="100"></span>
          <span class="until"></span>
        </div>
      </div>
      <div class="row" id="row-seven">
        <div class="name">7d</div>
        <div class="line">
          <span class="bar" role="progressbar" aria-label="last 7 days" aria-valuemin="0" aria-valuemax="100"></span>
          <span class="until"></span>
        </div>
      </div>
    </section>
    <section id="empty" hidden>
      <p id="empty-head"></p>
      <p class="how" id="empty-how"></p>
      <button id="setup">How to set it up</button>
    </section>
    <button id="update" hidden></button>
    <footer>
      <span id="age"></span>
      <span id="version"></span>
    </footer>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
