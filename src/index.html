<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Camel</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="panel">
    <section id="rows" hidden>
      <div class="row" id="row-five">
        <div class="top"><span class="name">5-hour window</span><span class="left"></span></div>
        <div class="bar"><span></span></div>
        <div class="reset"><span class="when"></span><span class="in"></span></div>
      </div>
      <div class="row" id="row-seven">
        <div class="top"><span class="name">Week</span><span class="left"></span></div>
        <div class="bar"><span></span></div>
        <div class="reset"><span class="when"></span><span class="in"></span></div>
      </div>
    </section>
    <section id="empty" hidden>
      <p>No limit data yet.</p>
      <p class="how">Camel reads what the Claude Code status line writes. Talk to Claude Code once and the bars appear.</p>
    </section>
    <button id="update" hidden></button>
    <footer>
      <span id="age"></span>
      <span id="version"></span>
    </footer>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
