<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Camel</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="panel">
    <section id="rows" hidden>
      <div class="row" id="row-five">
        <!-- "left", not a bare percent: every progress bar the user has ever
             seen fills up as things get worse, and this one drains. -->
        <div class="top"><span class="name">Last 5 hours</span><span class="left"><span class="pct"></span><span class="unit">left</span></span></div>
        <!-- The bar carries the same reading as the number, so a screen reader
             gets the geometry too, not just the digits. -->
        <div class="bar" role="progressbar" aria-label="Last 5 hours" aria-valuemin="0" aria-valuemax="100"><span></span></div>
        <div class="reset"><span class="when"></span><span class="in"></span></div>
      </div>
      <div class="row" id="row-seven">
        <div class="top"><span class="name">Last 7 days</span><span class="left"><span class="pct"></span><span class="unit">left</span></span></div>
        <div class="bar" role="progressbar" aria-label="Last 7 days" aria-valuemin="0" aria-valuemax="100"><span></span></div>
        <div class="reset"><span class="when"></span><span class="in"></span></div>
      </div>
    </section>
    <section id="empty" hidden>
      <p id="empty-head"></p>
      <p class="how" id="empty-how"></p>
      <button id="setup">How to set it up</button>
    </section>
    <button id="update" hidden></button>
    <footer>
      <span id="age"></span>
      <span id="version"></span>
    </footer>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
